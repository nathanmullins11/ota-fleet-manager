# Eclipse Mosquitto configuration for the OTA Fleet Manager control plane.
#
# Iteration 1 only: plain MQTT with anonymous clients, so anyone who can reach port 1883
# can publish and subscribe. On the cloud VM, limit port 1883 in the security group to
# known IP addresses. TLS and per-device credentials (FR-7, NF-3) replace this in Iteration 3.

listener 1883
allow_anonymous true

# Send logs to `docker compose logs mosquitto`.
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type all
