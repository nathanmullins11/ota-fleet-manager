# Eclipse Mosquitto configuration for the OTA Fleet Manager control plane (FR-7, NF-3).
#
# TLS only, on 8883: there is no plain-text listener. Every client signs in with its own
# username and password, and an access list limits each one to its own topics.
# The certificates and the password file are created by tools/mqtt_security.py setup
# (demo/cloud/control-plane.sh and the local demo run it) into deploy/mqtt/generated/,
# which is mounted at /mosquitto/security.

listener 8883
cafile /mosquitto/security/ca.crt
certfile /mosquitto/security/broker.crt
keyfile /mosquitto/security/broker.key
tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file /mosquitto/security/passwords
acl_file /mosquitto/config/acl

# Commands, events and heartbeats are well under 4 KB; refuse anything far larger.
max_packet_size 65536

# Persistent sessions (threats D7, D11): devices and the orchestrator connect with clean
# sessions off, so the broker queues QoS 1 commands and events for a client that is
# offline. Keep sessions and queued messages on disk (the mosquitto-data volume) so a
# broker restart does not lose them, and forget clients that stay away for a week.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 7d
max_queued_messages 1000

# Send logs to `docker compose logs mosquitto` (failed sign-ins appear here).
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type all
