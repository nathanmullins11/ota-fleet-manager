# Control plane services for the OTA Fleet Manager.
# Start with:  cp .env.example .env   (then edit the password)
#              docker compose up -d --build
# Dashboard (Grafana): http://localhost:3000, or http://<vm-ip>:3000 on the cloud VM.

name: ota-fleet-manager

# Caps each service at 30 MB of logs so they cannot fill the cloud VM's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging: *logging
    ports:
      # TLS only. Open to other hosts because devices connect from outside the VM.
      - "8883:8883"
    environment:
      MQTT_OPS_PASSWORD: ${MQTT_OPS_PASSWORD:?Set MQTT_OPS_PASSWORD in deploy/.env}
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/acl:/mosquitto/config/acl:ro
      # Certificates and the password file: tools/mqtt_security.py setup.
      - ${MQTT_SECURITY_DIR:-./mqtt/generated}:/mosquitto/security:ro
    healthcheck:
      # Healthy once the broker accepts a signed-in TLS client and serves its uptime topic.
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/security/ca.crt -u ops -P \"$$MQTT_OPS_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
    ports:
      # Bound to localhost only so the database is never reachable from outside the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, the first time the pgdata volume is created.
      - ./registries/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  software-registry:
    build: ./registries/software
    restart: unless-stopped
    logging: *logging
    ports:
      - "8080:8080"
    volumes:
      # Read-only: add or change packages by editing this folder, no rebuild needed.
      - ./registries/software/packages:/packages:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    logging: *logging
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_USERNAME: orchestrator
      MQTT_PASSWORD: ${MQTT_ORCHESTRATOR_PASSWORD:?Set MQTT_ORCHESTRATOR_PASSWORD in deploy/.env}
      MQTT_CA_CERT: /run/ota/ca.crt
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-30}
      OFFLINE_CHECK_INTERVAL_SECONDS: ${OFFLINE_CHECK_INTERVAL_SECONDS:-5}
      REGISTRY_URL: http://software-registry:8080
      # The registry address as devices see it; it goes into update and rollback commands.
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://host.docker.internal:8080}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-120}
      # Default health limits for rollouts (cli.py rollout start can override them).
      HEALTH_WINDOW_SECONDS: ${HEALTH_WINDOW_SECONDS:-60}
      HEALTH_MAX_CRASHES: ${HEALTH_MAX_CRASHES:-0}
      HEALTH_MAX_ERRORS: ${HEALTH_MAX_ERRORS:-10}
      HEALTH_MAX_FAILED_DEVICES: ${HEALTH_MAX_FAILED_DEVICES:-0}
      HEALTH_UNRESPONSIVE_SECONDS: ${HEALTH_UNRESPONSIVE_SECONDS:-45}
      # The orchestrator creates the dashboard's read-only database login with this password.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-dashboard-read-only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${MQTT_SECURITY_DIR:-./mqtt/generated}/ca.crt:/run/ota/ca.crt:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      software-registry:
        condition: service_healthy

  # CPU and memory of the control-plane containers, for the dashboard. Reads container
  # stats from the Docker socket (mounted read-only) and writes them to control_plane_stats.
  # Access to the Docker socket is powerful: this service only lists and reads stats.
  stats-collector:
    build: ./stats-collector
    restart: unless-stopped
    logging: *logging
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
      STATS_INTERVAL_SECONDS: ${STATS_INTERVAL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Live, view-only operations dashboard (FR-9). Configured entirely from deploy/grafana/:
  # the data source (the read-only login above) and the dashboard itself.
  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "3000:3000"
    environment:
      GRAFANA_DB_HOST: postgres:5432
      GRAFANA_DB_NAME: ${POSTGRES_DB:-ota}
      GRAFANA_DB_USER: dashboard_reader
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-dashboard-read-only}
      # Anyone who can reach the port sees the dashboard read-only; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started   # it creates the dashboard's database login

volumes:
  pgdata:
  grafana-data:
