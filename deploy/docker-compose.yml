# Control plane services for the OTA Fleet Manager.
# Start with:  cp .env.example .env   (then edit the password)
#              docker compose up -d --build
# More services (Grafana) are added in later tasks.

name: ota-fleet-manager

# Caps each service at 30 MB of logs so they cannot fill the cloud VM's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging: *logging
    ports:
      # Open to other hosts because devices connect from outside the VM.
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # Healthy once the broker accepts a client and serves its own uptime topic.
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
    ports:
      # Bound to localhost only so the database is never reachable from outside the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, the first time the pgdata volume is created.
      - ./registries/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  software-registry:
    build: ./registries/software
    restart: unless-stopped
    logging: *logging
    ports:
      - "8080:8080"
    volumes:
      # Read-only: add or change packages by editing this folder, no rebuild needed.
      - ./registries/software/packages:/packages:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    logging: *logging
    environment:
      MQTT_HOST: mosquitto
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-30}
      OFFLINE_CHECK_INTERVAL_SECONDS: ${OFFLINE_CHECK_INTERVAL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
